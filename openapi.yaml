  /tables/{table_id}/rows/{row_id}:
    parameters:
      - name: table_id
        in: path
        required: true
        schema:
          type: string
      - name: row_id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      operationId: getRow
      tags: [Rows]
      summary: Get a single row
      responses:
        "200":
          description: Row details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Row"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      operationId: updateRow
      tags: [Rows]
      summary: Update a row
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: object
                  additionalProperties: true
                  description: Key-value pairs to update. Only provided keys are changed.
      responses:
        "200":
          description: Updated row
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Row"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      operationId: deleteRow
      tags: [Rows]
      summary: Delete a row
      description: Idempotent for a completed table. The handler returns `204` even when the row does not exist in that table.
      responses:
        "204":
          description: Row deleted or already absent

  /tables/{table_id}/rows/bulk-update:
    parameters:
      - name: table_id
        in: path
        required: true
        schema:
          type: string

    post:
      operationId: bulkUpdateRows
      tags: [Rows]
      summary: Bulk update a column across multiple rows
      description: Updates only matching rows in the table and returns their count. Unknown or foreign row IDs are ignored. The handler does not validate `column_key` against the table's Product Schema snapshot.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [row_ids, column_key, value]
              properties:
                row_ids:
                  type: array
                  items:
                    type: string
                column_key:
                  type: string
                value:
                  description: The value to set for all specified rows
      responses:
        "200":
          description: Rows updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated_count:
                    type: integer
        "400":
          $ref: "#/components/responses/BadRequest"

  /tables/{table_id}/rows/bulk-delete:
    parameters:
      - name: table_id
        in: path
        required: true
        schema:
          type: string

    post:
      operationId: bulkDeleteRows
      tags: [Rows]
      summary: Delete multiple rows
      description: Deletes matching rows from the table. Unknown or foreign row IDs are ignored; `deleted_count` reports the rows actually removed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [row_ids]
              properties:
                row_ids:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: Rows deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted_count:
                    type: integer
        "400":
          $ref: "#/components/responses/BadRequest"

