openapi: 3.1.0
info:
  title: Lasso API
  description: AI-powered product data extraction and enhancement API
  version: 1.0.0
  contact:
    name: Lasso Support
    url: https://lasso.ai
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: https://app.productlasso.com/api/v1
    description: Production
security:
  - BearerAuth: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API Key

  parameters:
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        default: 1
        minimum: 1
    LimitParam:
      name: limit
      in: query
      schema:
        type: integer
        default: 25
        minimum: 1
        maximum: 100
    SearchParam:
      name: search
      in: query
      schema:
        type: string

    ProductAnalyticsFromParam:
      name: from
      in: query
      required: true
      description: Inclusive reporting-period start.
      schema:
        type: string
        format: date

    ProductAnalyticsToParam:
      name: to
      in: query
      required: true
      description: Inclusive reporting-period end. The range may contain at most 1,830 days.
      schema:
        type: string
        format: date

    ProductAnalyticsCatalogStatusParam:
      name: catalog_status
      in: query
      description: Current Catalog status to include. `all` means active and draft products.
      schema:
        type: string
        enum: [all, active, draft, archived]
        default: all

    ProductAnalyticsUserParam:
      name: user_id
      in: query
      description: Current or former user UUID, or `system` for unattributed automation.
      schema:
        type: string

    ProductAnalyticsSchemaParam:
      name: schema_id
      in: query
      description: Filters both Catalog products and Lasso extraction tables by schema.
      schema:
        type: string
        format: uuid

    ProductAnalyticsTableParam:
      name: table_id
      in: query
      description: Filters Lasso analytics to one extraction table.
      schema:
        type: string
        format: uuid

    ProductAnalyticsSourceParam:
      name: source
      in: query
      description: Catalog-only source filter. Requires `scope=catalog`.
      schema:
        type: string
        enum: [manual, product_extraction, shopify]

  schemas:
    Error:
      type: object
      required: [status_code, error_type, message, request_id]
      properties:
        status_code:
          type: integer
        error_type:
          type: string
          enum:
            - invalid_request
            - unauthenticated
            - forbidden
            - not_found
            - conflict
            - validation_error
            - rate_limited
            - service_unavailable
            - internal_error
        message:
          type: string
        request_id:
          type: string
        code:
          type: string
          description: Stable machine-readable detail code for validation, conflict, and retryable availability errors.
        retryable:
          type: boolean
          description: Whether the request can be retried without changing its payload.
        attribute_id:
          type: string
          format: uuid
          description: Stable Attribute identity when the error is scoped to one Attribute.
        attribute_key:
          type: string
          description: Attribute key when the error is scoped to one Attribute.
        details:
          type: object
          additionalProperties: true
        current_updated_at:
          type: string
          format: date-time
          description: Current resource revision supplied for client-directed refetch after a stale write.

    AttributeType:
      type: string
      enum: [text, number, url, email, date, boolean, richtext, format, enum, tags, image, images, file, files, json, relation]

    FormatOutputType:
      type: string
      enum: [text, number, boolean, json, richtext, file, image]
      description: The stored result type produced by a format Attribute. Format formulas execute only in Extraction; Catalog stores the resulting value.

    ImageConfig:
      type: object
      additionalProperties: false
      description: Canonical requirements shared by every usage of an image Attribute.
      properties:
        format:
          type: string
          enum: [original, webp, jpeg, png]
        required_aspect_ratio:
          type: string
          enum: [original, "1:1", "1:4", "1:8", "2:3", "3:2", "3:4", "4:1", "4:3", "4:5", "5:4", "8:1", "9:16", "16:9", "21:9"]
        required_background_color:
          type: string
          enum: [white, black]
          description: Omit to accept any background and preserve existing image behavior.
        max_size_mb:
          type: number
          minimum: 0
        min_width:
          type: number
          minimum: 0
        min_height:
          type: number
          minimum: 0
        max_width:
          type: number
          minimum: 0
        max_height:
          type: number
          minimum: 0

    NumberConfig:
      type: object
      additionalProperties: false
      description: Presentation metadata for number and Formula-number Attributes. Stored and API values remain numeric.
      properties:
        unit:
          type: string
          minLength: 1
          maxLength: 64
          description: Literal, untranslated unit.
        unit_position:
          type: string
          enum: [before, after]
          default: after
        format_style:
          type: string
          enum: [dot_plain, comma_plain, dot_with_comma_grouping, comma_with_dot_grouping, dot_with_space_grouping, comma_with_space_grouping]
        file_export:
          type: string
          enum: [raw, formatted_text]
          default: raw
          description: Applies to CSV/XLSX file exports, including files requested through export endpoints. JSON and non-file API or integration values remain raw.

    Attribute:
      type: object
      additionalProperties: false
      required: [id, key, label, type, format_output_type, enum_values, tags_values, allow_custom_values, boolean_config, number_config, relation_config, description, validation, language, image_config, status, archived_at, is_reviewed, source_id, external_id, source_synced_at, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
        label:
          type: string
        type:
          $ref: "#/components/schemas/AttributeType"
        format_output_type:
          oneOf:
            - $ref: "#/components/schemas/FormatOutputType"
            - type: "null"
          type: [string, "null"]
          description: Declared output type for format Attributes; null for all other Attribute types.
        enum_values:
          type: [array, "null"]
          items:
            type: string
        tags_values:
          type: [array, "null"]
          items:
            type: string
        allow_custom_values:
          type: boolean
          description: Whether table editors may append missing enum or tag choices.
        boolean_config:
          type: [object, "null"]
          additionalProperties: true
        number_config:
          oneOf:
            - $ref: "#/components/schemas/NumberConfig"
            - type: "null"
          type: [object, "null"]
          description: Present only as metadata; Attribute values returned by APIs remain raw numbers.
        relation_config:
          type: [object, "null"]
          additionalProperties: true
        description:
          type: [string, "null"]
        validation:
          type: [object, "null"]
          additionalProperties: true
        language:
          type: [string, "null"]
        image_config:
          oneOf:
            - $ref: "#/components/schemas/ImageConfig"
            - type: "null"
          type: [object, "null"]
        status:
          type: string
          enum: [active, archived]
          description: Derived from archive state. Archive and restore remain Dashboard-only.
        archived_at:
          type: [string, "null"]
          format: date-time
        is_reviewed:
          type: boolean
        source_id:
          type: [string, "null"]
          format: uuid
        external_id:
          type: [string, "null"]
        source_synced_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      examples:
        - id: 11111111-1111-4111-8111-111111111111
          key: product_name
          label: Product name
          type: text
          format_output_type: null
          enum_values: null
          tags_values: null
          allow_custom_values: true
          boolean_config: null
          number_config: null
          relation_config: null
          description: Public product title
          validation: null
          language: en
          image_config: null
          status: active
          archived_at: null
          is_reviewed: true
          source_id: null
          external_id: null
          source_synced_at: null
          created_at: "2026-07-01T00:00:00.000Z"
          updated_at: "2026-07-14T10:00:00.000Z"

    AttributeInput:
      type: object
      additionalProperties: false
      required: [key, label, type]
      properties:
        key:
          type: string
          pattern: "^[a-zA-Z0-9][a-zA-Z0-9_/]*$"
        label:
          type: string
        type:
          $ref: "#/components/schemas/AttributeType"
        format_output_type:
          oneOf:
            - $ref: "#/components/schemas/FormatOutputType"
            - type: "null"
          description: Only valid for format Attributes. Defaults to text when omitted or null.
        enum_values:
          type: [array, "null"]
          items:
            type: string
        tags_values:
          type: [array, "null"]
          items:
            type: string
        allow_custom_values:
          type: boolean
          default: true
        boolean_config:
          type: [object, "null"]
          additionalProperties: true
        number_config:
          oneOf:
            - $ref: "#/components/schemas/NumberConfig"
            - type: "null"
          description: Only valid for number or Formula-number Attributes. Omit during an upsert to preserve existing metadata.
        relation_config:
          type: [object, "null"]
          additionalProperties: true
          description: Relation kind is immutable after creation.
        description:
          type: [string, "null"]
        validation:
          type: [object, "null"]
          additionalProperties: true
        language:
          type: [string, "null"]
          description: When omitted during an upsert, the existing language is preserved.
        image_config:
          $ref: "#/components/schemas/ImageConfig"
          description: When omitted during an upsert, existing canonical image requirements are preserved. Send an empty object to clear them.
        is_reviewed:
          type: boolean

    AttributeUpdateInput:
      type: object
      additionalProperties: false
      properties:
        key:
          type: string
          deprecated: true
          description: Retained for request compatibility but does not rename the Attribute. Use the rename operation.
        label:
          type: string
        format_output_type:
          oneOf:
            - $ref: "#/components/schemas/FormatOutputType"
            - type: "null"
          description: Only valid for format Attributes. Omit to preserve the current output type; null resets it to text.
        enum_values:
          type: [array, "null"]
          items:
            type: string
        tags_values:
          type: [array, "null"]
          items:
            type: string
        allow_custom_values:
          type: boolean
        boolean_config:
          type: [object, "null"]
          additionalProperties: true
        number_config:
          oneOf:
            - $ref: "#/components/schemas/NumberConfig"
            - type: "null"
          description: Only valid for number or Formula-number Attributes. Send null to clear; omitted fields remain unchanged.
        relation_config:
          type: [object, "null"]
          additionalProperties: true
          description: Relation configuration may change, but relation kind is immutable.
        description:
          type: [string, "null"]
        validation:
          type: [object, "null"]
          additionalProperties: true
        language:
          type: [string, "null"]
          description: Omitted fields remain unchanged.
        image_config:
          $ref: "#/components/schemas/ImageConfig"
          description: Omitted fields remain unchanged. Send an empty object to clear canonical requirements.
        is_reviewed:
          type: boolean
        detach:
          type: boolean
          description: Detach a source-managed Attribute before editing source-owned content.
        expected_updated_at:
          type: string
          format: date-time
          description: Optional compare-and-set revision. Refetch after a stale_write response.

    AttributeBulkInput:
      type: object
      required: [attributes]
      properties:
        attributes:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: "#/components/schemas/AttributeInput"

    AttributeBulkResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Attribute"

    AttributeListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Attribute"
        pagination:
          $ref: "#/components/schemas/Pagination"

    AttributeRenameResult:
      type: object
      required: [updated, errors, error_count, code]
      properties:
        updated:
          type: integer
          minimum: 0
        errors:
          type: array
          maxItems: 0
          description: Empty for an atomic successful rename.
          items:
            type: string
        error_count:
          type: integer
          const: 0
        code:
          type: string
          const: ok

    AttributeRenameResponse:
      type: object
      required: [success, partial, old_key, new_key, updated_count, error_count, attribute, results]
      properties:
        success:
          type: boolean
          const: true
        partial:
          type: boolean
          const: false
        old_key:
          type: string
        new_key:
          type: string
        updated_count:
          type: integer
          minimum: 0
        error_count:
          type: integer
          const: 0
        attribute:
          $ref: "#/components/schemas/Attribute"
        results:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/AttributeRenameResult"

    Pagination:
      type: object
      required: [page, limit, total]
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer

    ColumnType:
      type: string
      enum: [text, number, url, email, date, boolean, richtext, runnable, format, enum, tags, image, images, file, files, json, relation]

    Column:
      type: object
      additionalProperties: true
      required: [attribute_id, kind, key, label, type]
      description: |
        A column returned by schema and table read APIs. Every returned column includes
        `attribute_id` and `kind`. Attribute columns are hydrated from the current company
        Attribute definition; helpers keep their table- or schema-local definition.

        API visibility does not imply eligibility for Catalog or other persistent/scheduled
        sync destinations. Those destinations accept canonical Attribute-backed columns only.
        Filter canonical columns with `kind == "attribute"`; helpers remain available for
        one-time table reads and file exports according to the destination's rules.
      properties:
        id:
          type: string
          description: Server-issued stable usage ID. Retain it when round-tripping schema updates.
        attribute_id:
          type: [string, "null"]
          format: uuid
          description: Stable company Attribute ID, or null for a local helper.
        kind:
          type: string
          enum: [attribute, helper]
          description: Derived column identity. Callers cannot use this field to bypass destination eligibility.
        attribute_status:
          type: string
          enum: [active, archived]
        attribute_archived_at:
          type: [string, "null"]
          format: date-time
        attribute_resolution_error:
          type: string
          enum: [missing_attribute]
        key:
          type: string
          description: Unique column identifier
        label:
          type: string
          description: Display name
        type:
          $ref: "#/components/schemas/ColumnType"
        format_output_type:
          oneOf:
            - $ref: "#/components/schemas/FormatOutputType"
            - type: "null"
          description: Declared stored value type for Formula columns. Null or omitted defaults to text.
        required:
          type: boolean
          default: false
        description:
          type: string
        language:
          type: [string, "null"]
          description: Language code inherited from the canonical Attribute when configured.
        enum_values:
          type: array
          items:
            type: string
          description: Allowed values for enum and tags types
        tags_values:
          type: array
          items:
            type: string
        boolean_config:
          type: object
          additionalProperties: true
        number_config:
          oneOf:
            - $ref: "#/components/schemas/NumberConfig"
            - type: "null"
          description: Canonical presentation metadata. API values remain raw numbers.
        validation:
          oneOf:
            - type: object
              additionalProperties: true
            - type: string
        image_config:
          type: object
          additionalProperties: true
        runnable_config:
          type: object
          additionalProperties: true
        format_config:
          type: object
          additionalProperties: true
        enum_config:
          type: object
          additionalProperties: true
        tags_config:
          type: object
          additionalProperties: true
        relation_config:
          type: [object, "null"]
          additionalProperties: true
        zip_export_config:
          type: object
          additionalProperties: true
        fast_photo_config:
          type: object
          additionalProperties: true
        content_template:
          type: object
          additionalProperties: true
        always_export:
          type: boolean
        never_export:
          type: boolean
        zip_name_column:
          type: string
        content_template_id:
          type: string
        is_title:
          type: boolean
        is_thumbnail:
          type: boolean
          description: Marks this Shared image/gallery usage as the Catalog product thumbnail.
      examples:
        - attribute_id: 11111111-1111-4111-8111-111111111111
          kind: attribute
          key: product_name
          label: Product name
          type: text
          language: en
        - attribute_id: null
          kind: helper
          key: working_copy
          label: Working copy
          type: text

    SchemaColumnInput:
      type: object
      additionalProperties: true
      required: [key, label, type]
      description: |
        Column accepted by schema create/update. Omitting both `attribute_id` and `kind`
        retains legacy behavior: the server creates or attaches the shared Attribute for
        the key. Send `kind: helper` to opt into a local helper. Send `attribute_id` with
        `kind: attribute` to attach an existing company Attribute; key and type must match.
      properties:
        id:
          type: string
          description: Existing usage ID to retain during full schema updates.
        attribute_id:
          type: [string, "null"]
          format: uuid
        kind:
          type: string
          enum: [attribute, helper]
        key:
          type: string
        label:
          type: string
        type:
          $ref: "#/components/schemas/ColumnType"
        format_output_type:
          oneOf:
            - $ref: "#/components/schemas/FormatOutputType"
            - type: "null"
          description: Declared stored value type for Formula columns. Null or omitted defaults to text.
        required:
          type: boolean
          default: false
        description:
          type: string
        language:
          type: [string, "null"]
        enum_values:
          type: array
          items:
            type: string
        tags_values:
          type: array
          items:
            type: string
        boolean_config:
          type: object
          additionalProperties: true
        number_config:
          oneOf:
            - $ref: "#/components/schemas/NumberConfig"
            - type: "null"
        validation:
          oneOf:
            - type: object
              additionalProperties: true
            - type: string
        image_config:
          type: object
          additionalProperties: true
        runnable_config:
          type: object
          additionalProperties: true
        format_config:
          type: object
          additionalProperties: true
        enum_config:
          type: object
          additionalProperties: true
        tags_config:
          type: object
          additionalProperties: true
        relation_config:
          type: [object, "null"]
          additionalProperties: true
        zip_export_config:
          type: object
          additionalProperties: true
        fast_photo_config:
          type: object
          additionalProperties: true
        content_template:
          type: object
          additionalProperties: true
        always_export:
          type: boolean
        never_export:
          type: boolean
        zip_name_column:
          type: string
        content_template_id:
          type: string
        is_title:
          type: boolean
        is_thumbnail:
          type: boolean
          description: Marks this Shared image/gallery usage as the Catalog product thumbnail.

    InlineColumn:
      type: object
      required: [key, label, type]
      description: Ephemeral output shape for search/enrich; it does not create or attach a shared Attribute.
      properties:
        key:
          type: string
        label:
          type: string
        type:
          $ref: "#/components/schemas/ColumnType"
        required:
          type: boolean
          default: false
        description:
          type: string
        enum_values:
          type: array
          items:
            type: string

    Schema:
      type: object
      required: [id, name, columns, created_at, updated_at]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        is_default:
          type: boolean
        columns:
          type: array
          items:
            $ref: "#/components/schemas/Column"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      examples:
        - id: 9e1c77dd-8f10-41ca-bfe8-e672b89692d1
          name: Supplier products
          description: Core supplier feed fields
          is_default: false
          columns:
            - id: 8d79b7da-7134-443e-8110-678fe04de51b
              attribute_id: 11111111-1111-4111-8111-111111111111
              kind: attribute
              key: product_name
              label: Product name
              type: text
          created_at: "2026-08-31T09:00:00.000Z"
          updated_at: "2026-08-31T09:00:00.000Z"

    SchemaListItem:
      type: object
      required: [id, name, columns_count, created_at, updated_at]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        columns_count:
          type: integer
        is_default:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    File:
      type: object
      required: [id, filename, size, created_at]
      properties:
        id:
          type: string
          format: uuid
        filename:
          type: string
        size:
          type: integer
          description: File size in bytes
        content_type:
          type: string
        created_at:
          type: string
          format: date-time
      examples:
        - id: 4be9e43c-f03a-4309-938c-d2e9482752cf
          filename: supplier-products.xlsx
          size: 42816
          content_type: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
          created_at: "2026-08-31T09:10:00.000Z"

    TableStatus:
      type: string
      description: Raw extraction job status returned by the API.
      enum: [queued, queued_for_processing, processing, processing_by_worker, completed, error, cancelled]

    Table:
      type: object
      required: [id, name, schema_id, status, total_rows, created_at, updated_at]
      properties:
        id:
          type: string
        name:
          type: string
        schema_id:
          type: string
        status:
          $ref: "#/components/schemas/TableStatus"
        progress:
          type: integer
          minimum: 0
          maximum: 100
        total_rows:
          type: integer
        source_type:
          type: string
          enum: [files, text]
        additional_context:
          type: ["string", "null"]
        enhancement_context:
          type: ["string", "null"]
        error_message:
          type: ["string", "null"]
        files:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              path:
                type: string
                description: Stored source path or submitted source URL.
              size:
                type: integer
        locked:
          type: boolean
        locked_at:
          type: ["string", "null"]
          format: date-time
        locked_by:
          type: ["string", "null"]
          format: uuid
        skipped_source_updates:
          type: integer
        last_skipped_source_update_at:
          type: ["string", "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      examples:
        - id: d2b3dbe0-c77d-40d8-a5d2-480722489c64
          name: August supplier feed
          schema_id: 9e1c77dd-8f10-41ca-bfe8-e672b89692d1
          status: queued_for_processing
          progress: 0
          total_rows: 0
          source_type: text
          additional_context: Prices use EUR.
          enhancement_context: null
          error_message: null
          files: []
          locked: false
          locked_at: null
          locked_by: null
          skipped_source_updates: 0
          last_skipped_source_update_at: null
          created_at: "2026-08-31T09:15:00.000Z"
          updated_at: "2026-08-31T09:15:00.000Z"

    TableListItem:
      type: object
      required: [id, name, status, total_rows, schema_id, created_at]
      properties:
        id:
          type: string
        name:
          type: string
        status:
          $ref: "#/components/schemas/TableStatus"
        total_rows:
          type: integer
        schema_id:
          type: string
        locked:
          type: boolean
        locked_at:
          type: ["string", "null"]
          format: date-time
        locked_by:
          type: ["string", "null"]
          format: uuid
        created_at:
          type: string
          format: date-time

    Row:
      type: object
      required: [id, row_index, data, created_at]
      properties:
        id:
          type: string
          format: uuid
        row_index:
          type: integer
